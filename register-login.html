<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportBot Authentication</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1e293b; /* Dark Navy */
      color: #e2e8f0; /* Accent Light Text */
    }

    .auth-container {
      background-color: #334155; /* Light Navy */
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #e2e8f0; /* Accent Text */
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      text-align: left;
      color: #e2e8f0; /* Accent Text */
      font-weight: bold;
      margin-bottom: 5px;
    }

    input {
      padding: 10px;
      border: 1px solid #475569; /* Slightly lighter navy */
      border-radius: 5px;
      font-size: 14px;
      width: 100%;
      background-color: #1e293b; /* Dark Navy */
      color: #e2e8f0; /* Accent Text */
    }

    button {
      padding: 10px;
      background-color: #334155; /* Light Navy */
      color: #e2e8f0; /* Accent Text */
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #475569; /* Hover Light Navy */
    }

    .social-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .social-buttons button {
      background-color: #1e293b; /* Dark Navy */
      color: #e2e8f0; /* Accent Text */
      border: 1px solid #475569;
      padding: 10px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .social-buttons button:hover {
      background-color: #475569; /* Hover Light Navy */
    }

    p {
      margin: 15px 0 5px;
      font-size: 14px;
      color: #e2e8f0; /* Accent Text */
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h1>Welcome to SupportBot</h1>
    <form id="authForm">
      <div>
        <label for="email">Email address:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>
      <button type="button" id="signupButton">Register</button>
      <button type="button" id="loginButton" class="hidden" onclick="redirectToChat()">Login</button>
    </form>
    <p>Or continue with:</p>
    <div class="social-buttons">
      <button type="button">Twitter</button>
      <button type="button">GitHub</button>
    </div>
  </div>

  <script>
    const authForm = document.getElementById('authForm');
    const loginButton = document.getElementById('loginButton');
    const signupButton = document.getElementById('signupButton');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    signupButton.addEventListener('click', () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      // Validate email for general domain patterns
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert('Please enter a valid email address.');
        return;
      }

      // Validate password length
      if (password.length < 8) {
        alert('Password must be at least 8 characters long.');
        return;
      }

      alert('Registration successful!');
      signupButton.classList.add('hidden');
      loginButton.classList.remove('hidden');
    });

    // Redirect to chat page
    function redirectToChat() {
      window.location.href = 'interact.html'; // Ensure interact.html is in the same directory
    }
  </script>
</body>
</html>
